model_version: v8.0-phase5
source: Phase 4 AS006 pruning decisions

input:
  phase4_pruning_decisions: outputs/v8_0_phase4_identifiability_pruning/AS006_v8_0_phase4_pruning_decisions.csv

transfer_primary:
  - combined physical bottleneck
  - contact-relaxed weak links
  - crack/tunnel-like weak links

required_controls:
  - no weak links
  - uniform weak links
  - shuffled weak links
  - central-lane / 1D-like

diagnostic_controls:
  - anisotropic control

diagnostic_hold:
  - boundary/SNS-inspired constriction

devices:
  - AS001
  - AS002
  - AS003
  - AS004
  - AS005
  - AS006

validation_policy:
  no_new_physics_classes: true
  no_device_specific_weak_link_retuning: true
  include_leave_one_device_out: true
  keep_required_controls: true
  report_device_failures_explicitly: true
  required_evidence_device_fraction: 0.80
  evidence_levels:
    level_a: R(T) transfer across all six devices
    level_b: probe-pair and selected nonlinear transfer where available
    level_c: full dV/dI(I,B) validation for AS006/current mapped field devices

execution:
  run_device_sweeps: false
  allow_cached_anchor_evidence: true
  scorer_requires_mapped_field_dvdi: true
  current_mapped_field_devices:
    - AS006
  topology_filter:
    - combined
    - contact_relaxation
    - tear_lane
    - none
    - uniform
    - shuffled
    - central_lane

outputs:
  folder: outputs/v8_0_phase5_transfer_plan
  candidate_set: AS006_v8_0_phase5_transfer_candidate_set.csv
  device_plan: AS006_v8_0_phase5_device_plan.csv
  validation_gates: AS006_v8_0_phase5_validation_gates.csv
  data_manifest: phase5_data_manifest.csv
  device_run_status: AS006_v8_0_phase5_device_run_status.csv
  transfer_scores: AS006_v8_0_phase5_transfer_scores.csv
  device_summary: AS006_v8_0_phase5_device_summary.csv
  leave_one_device_out: AS006_v8_0_phase5_leave_one_device_out.csv
  gate_results: AS006_v8_0_phase5_gate_results.csv
  figure_base: AS006_v8_0_phase5_transfer_summary
  levelA_rt_manifest: phase5_rt_manifest.csv
  levelA_frozen_basin_set: phase5_frozen_basin_set.csv
  levelA_frozen_transfer_ledger: phase5_frozen_transfer_ledger.csv
  levelA_device_summary: phase5_levelA_device_summary.csv
  levelA_leave_one_device_out: phase5_levelA_leave_one_device_out.csv
  levelA_gate_results: phase5_levelA_gate_results.csv
  levelA_figure_base: phase5_levelA_rt_transfer_summary
  phase5B_frozen_phase5A_archive: phase5B_frozen_phase5A_archive.csv
  phase5B_secondary_probe_manifest: phase5B_secondary_probe_manifest.csv
  phase5B_secondary_probe_ledger: phase5B_secondary_probe_ledger.csv
  phase5B_device_evidence_table: phase5B_device_evidence_table.csv
  phase5B_class_heldout_validation: phase5B_class_heldout_validation.csv
  phase5B_activation_law_plan: phase5B_activation_law_plan.csv
  phase5B_hierarchical_gate_results: phase5B_hierarchical_gate_results.csv
  phase5B_figure_base: phase5B_secondary_hierarchy_summary
